<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="darkreader-lock">
<meta property="og:title" content="ytflex | simple youtube downloader">
<meta property="og:description" content="dead simple youtube downloader. no accounts, 1gb limit, 1 hour retention.">
<meta property="og:site_name" content="ytflex">
<meta property="og:image" content="https://arda0.net/assets/favicon">
<meta property="og:url" content="https://arda0.net/ytflex/">
<link rel="icon" href="/assets/favicon">
<title>ytflex | simple youtube downloader</title>
<link rel="stylesheet" href="https://arda0.net/assets/theme-base.css?v=1">
<script src="https://arda0.net/assets/theme.js?v=1"></script>
</head>
<body>
<main>
<div class="top"><a href="https://arda0.net/">&larr; home</a><div class="theme" role="group" aria-label="colour mode"><button type="button" data-mode="auto" aria-pressed="true">auto</button><button type="button" data-mode="light" aria-pressed="false">light</button><button type="button" data-mode="dark" aria-pressed="false">dark</button></div></div>
<div class="titlerow"><h1>ytflex</h1><a href="/ytflex/faq">faq</a></div>
<p class="sub">dead simple youtube downloader. no accounts, 1gb limit, 1 hour retention.</p>

<div class="card">
  <div class="stack">
    <input type="text" id="urlInput" placeholder="Paste YouTube URL here..." aria-label="YouTube link">
    <div class="grid2">
      <div>
        <label class="lbl" for="typeSelect">Type</label>
        <select id="typeSelect"><option value="video">Video</option><option value="audio">Audio</option></select>
      </div>
      <div id="resContainer">
        <label class="lbl" for="resSelect">Quality</label>
        <select id="resSelect"><option value="2160">4K</option><option value="1440">1440p</option><option value="1080" selected>1080p</option><option value="720">720p</option><option value="480">480p</option></select>
      </div>
    </div>
    <label id="formatContainer" class="check"><input type="checkbox" id="mp4Check"> Force MP4 Compatibility</label>
    <button type="button" id="dlBtn" class="btn block" onclick="handleFetch()">FETCH DOWNLOAD</button>
  </div>

  <div id="resultCard" class="result hidden">
    <div class="vid">
      <img id="thumb" src="" alt="">
      <div><div id="videoTitle" class="t">Video Title</div><div id="videoMeta" class="m">0:00 &bull; mp4 &bull; 0MB</div></div>
    </div>
    <div class="stack">
      <div class="copyrow">
        <input type="text" id="finalUrlDisplay" readonly>
        <button type="button" class="btn" onclick="copyToClipboard(document.getElementById('finalUrlDisplay').value, this)">COPY</button>
      </div>
      <div id="qrBox" class="qr hidden"><div id="qrHolder"></div><span class="muted">Scan to open the download link on another device</span></div>
      <a id="finalDlLink" href="#" target="_blank" rel="noopener" class="btn ok block">DOWNLOAD NOW</a>
    </div>
  </div>
</div>

<div id="history-container" class="card hidden">
  <h2 class="row"><span>recent downloads</span><button type="button" class="link" onclick="clearHistory()">clear</button></h2>
  <div id="history-list"></div>
</div>

<div class="card">
  <h2>browser shortcut</h2>
  <a href="ytflex.user.js" class="btn ghost block">ADD TO MY BROWSER</a>
</div>
</main>
<script src="https://arda0.net/assets/qrcode.min.js"></script>
<script>

        function el(tag, cls, text) {
            const n = document.createElement(tag);
            if (cls) n.className = cls;
            if (text !== undefined) n.textContent = text;
            return n;
        }

        // QR code of a link (qrcode-generator, hosted next to the theme). White background
        // with a quiet zone, so it scans in dark mode too. Returns null if the lib is missing.
        function qrImage(url, px) {
            try {
                const q = qrcode(0, 'M');
                q.addData(url);
                q.make();
                const img = document.createElement('img');
                img.src = q.createDataURL(4, 16);
                img.width = px;
                img.height = px;
                img.alt = 'QR code of the link';
                img.style.imageRendering = 'pixelated';
                return img;
            } catch (err) {
                console.error('QR failed:', err);
                return null;
            }
        }

        // Pop-up with a big QR code. Closes on the X, a click outside the card, or Escape.
        function showQrModal(url, title) {
            const img = qrImage(url, 256);
            if (!img) return;
            const overlay = el('div', 'overlay');
            const close = () => {
                overlay.remove();
                document.removeEventListener('keydown', onKey);
            };
            const onKey = (e) => { if (e.key === 'Escape') close(); };
            overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
            document.addEventListener('keydown', onKey);

            const card = el('div', 'modal');
            const x = el('button', 'x', '×');
            x.setAttribute('aria-label', 'Close');
            x.addEventListener('click', close);
            card.append(x, el('div', 'nm', title), img, el('div', 'muted', 'Scan to open the link on another device'));
            overlay.append(card);
            document.body.append(overlay);
        }

        async function copyToClipboard(text, btn) {
            try {
                await navigator.clipboard.writeText(text);
                const originalText = btn.innerText;
                btn.innerText = 'COPIED!';
                setTimeout(() => { btn.innerText = originalText; }, 1500);
            } catch (err) {
                console.error('Failed to copy', err);
            }
        }

        // test instances (served from a bare IP:port) talk to themselves, the real site to the public URL
        const apiUrl = location.hostname === "arda0.net" ? "https://arda0.net/ytflex" : location.origin;
        const typeSelect = document.getElementById('typeSelect');
        const resContainer = document.getElementById('resContainer');
        const formatContainer = document.getElementById('formatContainer');
        const historyContainer = document.getElementById('history-container');
        const historyList = document.getElementById('history-list');

        // How long the server keeps a file. Keep in sync with MAX_FILE_AGE in config.yaml (seconds).
        const FILE_LIFETIME_MS = 3600 * 1000;
        const FETCH_LABEL = 'FETCH DOWNLOAD';

        window.addEventListener('load', renderHistory);
        setInterval(renderHistory, 30000);

        typeSelect.addEventListener('change', (e) => {
            const isVideo = e.target.value === 'video';
            resContainer.classList.toggle('hidden', !isVideo);
            formatContainer.classList.toggle('hidden', !isVideo);
        });

        async function handleFetch() {
            const btn = document.getElementById('dlBtn');
            const resultCard = document.getElementById('resultCard');
            const urlInput = document.getElementById('urlInput');

            if (!urlInput.value) return alert("Please paste a link first!");

            // UI State: Loading
            btn.disabled = true;
            btn.innerHTML = '<span class="spin"></span> FETCHING...';
            resultCard.classList.add('hidden');

            // The download request blocks until the file is ready, so progress comes from polling.
            const progressId = Array.from(crypto.getRandomValues(new Uint8Array(12)),
                b => (b % 36).toString(36)).join('');
            const stageLabel = { preparing: 'PREPARING', starting: 'STARTING', merging: 'MERGING',
                converting: 'CONVERTING', finishing: 'FINISHING' };
            const spinner = '<span class="spin"></span>';
            const poll = setInterval(async () => {
                try {
                    const r = await fetch(`${apiUrl}/progress/${progressId}`);
                    if (!r.ok) return;
                    const p = await r.json();
                    if (p.stage === 'downloading') {
                        btn.innerHTML = `${spinner} DOWNLOADING ${p.percent}%`;
                        btn.style.background = `linear-gradient(to right, var(--acc) ${p.percent}%, color-mix(in srgb, var(--acc) 35%, var(--card)) ${p.percent}%)`;
                    } else {
                        // no real percentage for conversion: show the stage and how long it has been running
                        const slow = p.stage === 'converting' || p.stage === 'merging';
                        btn.innerHTML = `${spinner} ${stageLabel[p.stage] || 'WORKING'}${slow ? ' · ' + p.elapsed + 's' : '...'}`;
                        btn.style.background = '';
                        btn.classList.toggle('pulse', slow);
                    }
                } catch (e) { /* keep the last label */ }
            }, 500);

            const type = typeSelect.value;
            const res = document.getElementById('resSelect').value;
            const mp4 = document.getElementById('mp4Check').checked;

            const baseUrl = `${apiUrl}/download/${type}`;
            const params = new URLSearchParams({ link: urlInput.value });
            if (type === 'video') {
                params.append('res', res);
                params.append('mp4', mp4);
            }
            params.append('progress_id', progressId);

            try {
                const response = await fetch(`${baseUrl}?${params.toString()}`);
                const data = await response.json();
                if (!Array.isArray(data)) {
                    // Error replies are {"message": ...} (busy, bad link, too big, ...)
                    return alert(data.message || "Something went wrong.");
                }
                const info = data[0][0];

                if (info && info.link) {
                    document.getElementById('thumb').src = info.metadata.thumbnail;
                    document.getElementById('videoTitle').innerText = info.metadata.title;
                    document.getElementById('videoMeta').innerText = `${info.metadata.duration} • ${info.metadata.extension} • ${info.metadata.filesize || 'N/A'}`;
                    document.getElementById('finalUrlDisplay').value = info.link;

                    const dlLink = document.getElementById('finalDlLink');
                    dlLink.href = info.link;
                    dlLink.setAttribute('download', `${info.metadata.title}.${info.metadata.extension}`);

                    showQr(info.link);
                    resultCard.classList.remove('hidden');

                    saveToHistory(info.metadata.title, info.link, info.metadata.thumbnail);
                }
            } catch (err) {
                alert("Error: Server unreachable");
                console.error(err);
            } finally {
                clearInterval(poll);
                btn.classList.remove('pulse');
                btn.style.background = '';
                btn.disabled = false;
                btn.textContent = FETCH_LABEL;
            }
        }

        function showQr(url) {
            const box = document.getElementById('qrBox');
            const img = qrImage(url, 168);
            document.getElementById('qrHolder').replaceChildren(...(img ? [img] : []));
            box.classList.toggle('hidden', !img);
        }

        // --- History Logic ---
        function saveToHistory(name, url, thumb) {
            const history = JSON.parse(localStorage.getItem('ytflex_history') || '[]');
            // Avoid duplicates
            if (history.find(i => i.url === url)) return;

            history.unshift({ name, url, thumb, date: new Date().toLocaleTimeString(), timestamp: Date.now() });
            localStorage.setItem('ytflex_history', JSON.stringify(history.slice(0, 10)));
            renderHistory();
        }

        function renderHistory() {
            let history = JSON.parse(localStorage.getItem('ytflex_history') || '[]');

            // The server deletes a file once it is older than FILE_LIFETIME_MS, so the
            // entry goes too. Entries without a timestamp are old ones from before
            // timestamps existed (only a clock time was saved), so they are dropped.
            const now = Date.now();
            const kept = history.filter(item => item.timestamp && (now - item.timestamp) < FILE_LIFETIME_MS);
            if (kept.length !== history.length) {
                localStorage.setItem('ytflex_history', JSON.stringify(kept));
            }
            history = kept;

            if (history.length === 0) {
                historyContainer.classList.add('hidden');
                return;
            }
            historyContainer.classList.remove('hidden');

            // Built with DOM APIs (not innerHTML + string interpolation) on purpose:
            // item.name/item.thumb come from the video's own metadata (title,
            // thumbnail URL), which is not under our control. textContent and
            // property assignment (img.src, a.href) never parse their input as
            // markup, so a crafted title cannot inject HTML/script here.
            historyList.replaceChildren(...history.map(item => {
                const row = el('div', 'hrow');
                const line = el('div', 'line');

                const left = el('div', 'left');
                const img = el('img', 'thumb');
                img.src = item.thumb;
                img.alt = '';

                const textWrap = el('div', 'txt');
                const nameSpan = el('span', 'nm', item.name);
                nameSpan.title = item.name;
                textWrap.append(nameSpan, el('span', 'dt', item.date));
                left.append(img, textWrap);

                const right = el('div', 'btns');

                const openLink = el('a', 'chip', 'DOWNLOAD');
                openLink.href = item.url;
                openLink.target = '_blank';
                openLink.rel = 'noopener';

                const copyBtn = el('button', 'chip', 'COPY');
                copyBtn.type = 'button';
                copyBtn.addEventListener('click', () => copyToClipboard(item.url, copyBtn));

                const qrBtn = el('button', 'chip', 'QR');
                qrBtn.type = 'button';
                qrBtn.addEventListener('click', () => showQrModal(item.url, item.name));

                right.append(openLink, copyBtn, qrBtn);
                line.append(left, right);
                row.append(line);
                return row;
            }));
        }

        function clearHistory() {
            localStorage.removeItem('ytflex_history');
            renderHistory();
        }
</script>
</body>
</html>
